<style>
  :root {
    --azul: #1a3a5c;
    --azul-claro: #2a6496;
    --verde: #1d6f42;
    --amarillo: #f5a623;
    --rojo: #c0392b;
    --naranja: #e67e22;
    --cyan: #16a085;
    --morado: #8e44ad;
    --gris: #ecf0f1;
    --gris2: #bdc3c7;
    --blanco: #ffffff;
    --fondo: #f0f4f8;
    --texto: #1a1a2e;
    --card-bg: rgba(255,255,255,0.97);
    --sidebar-w: 340px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Sora', sans-serif; background: var(--fondo); color: var(--texto); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* HEADER */
  header {
    background: var(--azul);
    color: white;
    padding: 0 1.5rem;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
    border-bottom: 3px solid var(--amarillo);
    z-index: 1000;
  }
  .header-icon {
    width: 36px; height: 36px;
    background: var(--amarillo);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  header span { font-size: 0.75rem; color: var(--gris2); font-weight: 300; }
  .header-badge {
    margin-left: auto;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'Space Mono', monospace;
  }

  /* LAYOUT */
  .app-body { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  aside {
    width: var(--sidebar-w);
    background: white;
    border-right: 1px solid #dde3ea;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    z-index: 100;
  }
  .sidebar-header {
    padding: 1rem 1.25rem 0.75rem;
    border-bottom: 1px solid #eee;
  }
  .search-wrap {
    position: relative;
    margin-top: 0.75rem;
  }
  .search-wrap input {
    width: 100%;
    padding: 8px 12px 8px 36px;
    border: 1.5px solid #dde3ea;
    border-radius: 8px;
    font-family: 'Sora', sans-serif;
    font-size: 0.82rem;
    outline: none;
    transition: border 0.2s;
  }
  .search-wrap input:focus { border-color: var(--azul-claro); }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: #999;
  }
  .filter-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid #eee;
  }
  .tab-btn {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn.active, .tab-btn:hover { opacity: 1; }

  .routes-list { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
  .routes-list::-webkit-scrollbar { width: 4px; }
  .routes-list::-webkit-scrollbar-thumb { background: #dde3ea; border-radius: 4px; }

  .route-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 1.25rem;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .route-item:hover { background: #f5f7fa; }
  .route-item.active { background: #eef4fb; border-left-color: var(--azul-claro); }
  .route-num {
    min-width: 44px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.75rem;
    color: white;
    flex-shrink: 0;
  }
  .route-info { flex: 1; min-width: 0; }
  .route-info h3 { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .route-info p { font-size: 0.7rem; color: #888; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .route-badge {
    font-size: 0.62rem; padding: 2px 7px; border-radius: 10px; font-weight: 600; flex-shrink: 0;
  }
  .stops-count { font-size: 0.65rem; color: #aaa; font-family: 'Space Mono', monospace; flex-shrink: 0; }

  /* MAP */
  #map { flex: 1; z-index: 1; }

  /* INFO PANEL */
  .info-panel {
    position: absolute;
    bottom: 20px; right: 20px;
    width: 280px;
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    z-index: 500;
    overflow: hidden;
    display: none;
  }
  .info-panel.visible { display: block; }
  .info-panel-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #eee;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .info-num-big {
    width: 48px; height: 48px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-weight: 700;
    color: white; font-size: 0.85rem; flex-shrink: 0;
  }
  .info-panel-header h2 { font-size: 0.9rem; font-weight: 700; line-height: 1.3; }
  .info-panel-header p { font-size: 0.72rem; color: #888; margin-top: 2px; }
  .info-meta { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
  .meta-chip { background: #f0f4f8; border-radius: 6px; padding: 4px 8px; font-size: 0.68rem; }
  .meta-chip b { font-weight: 700; }
  .stops-list { padding: 10px 16px 14px; max-height: 200px; overflow-y: auto; }
  .stops-list::-webkit-scrollbar { width: 3px; }
  .stops-list::-webkit-scrollbar-thumb { background: #dde; border-radius: 3px; }
  .stop-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px 0;
    font-size: 0.72rem;
  }
  .stop-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .stop-row.terminal .stop-dot { width: 10px; height: 10px; border-radius: 3px; margin-top: 3px; }
  .stop-line-wrap { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .stop-line { width: 2px; flex: 1; min-height: 12px; }
  .close-btn {
    position: absolute; top: 10px; right: 10px;
    background: none; border: none; cursor: pointer; font-size: 18px; color: #aaa; line-height: 1;
  }
  .close-btn:hover { color: #555; }

  /* Legend */
  .map-legend {
    position: absolute; top: 10px; right: 10px;
    background: white; border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    padding: 10px 14px; z-index: 500; font-size: 0.7rem;
  }
  .map-legend h4 { font-size: 0.72rem; font-weight: 700; margin-bottom: 6px; color: #444; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .legend-line { width: 20px; height: 3px; border-radius: 2px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .legend-sq { width: 8px; height: 8px; border-radius: 2px; background: #333; }
  .no-results { text-align: center; padding: 2rem 1rem; color: #aaa; font-size: 0.82rem; }

  @media (max-width: 700px) {
    :root { --sidebar-w: 100%; }
    .app-body { flex-direction: column; }
    aside { width: 100%; height: 220px; }
  }
</style>
</head>

<header>

    </div>
    <div class="info-panel" id="infoPanel">

</div>

});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// ===================== STATE =====================
let activeRoute = null;
let activeLayer = null;
let activeMarkers = [];
let filterType = 'todos';
let searchQ = '';

// ===================== RENDER SIDEBAR =====================
function typeBadge(type) {
  const t = TYPES[type];
  return `<span class="route-badge" style="background:${t.bg};color:${t.color};">${t.label}</span>`;
}

function buildSidebar() {
  const filtered = ROUTES.filter(r => {
    const matchType = filterType === 'todos' || r.type === filterType;
    const q = searchQ.toLowerCase();
    const matchQ = !q || r.num.toLowerCase().includes(q) || r.name.toLowerCase().includes(q);
    return matchType && matchQ;
  });

  const list = document.getElementById('routesList');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No se encontraron rutas 🔍</div>';
    return;
  }
  list.innerHTML = filtered.map(r => `
    <div class="route-item ${activeRoute && activeRoute.id === r.id ? 'active' : ''}" data-id="${r.id}">
      <div class="route-num" style="background:${r.color};">${r.num}</div>
      <div class="route-info">
        <h3>${r.name}</h3>
        <p>${r.stops[0].name.split(',')[0]} → ${r.stops[r.stops.length-1].name.split(',')[0]}</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        ${typeBadge(r.type)}
        <span class="stops-count">${r.stops.length} paradas</span>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.route-item').forEach(el => {
    el.addEventListener('click', () => {
      const route = ROUTES.find(r => r.id == el.dataset.id);
      selectRoute(route);
    });
  });
}

// ===================== FILTER TABS =====================
function buildTabs() {
  const tabs = document.getElementById('filterTabs');
  const types = [
    { key: 'todos', label: 'Todas', color: '#444', bg: '#eee' },
    { key: 'urbano', label: 'Urbano', color: TYPES.urbano.color, bg: TYPES.urbano.bg },
    { key: 'interurbano', label: 'Interurbano', color: TYPES.interurbano.color, bg: TYPES.interurbano.bg },
    { key: 'interdepartamental', label: 'Interdep.', color: TYPES.interdepartamental.color, bg: TYPES.interdepartamental.bg },
  ];
  tabs.innerHTML = types.map(t => `
    <button class="tab-btn ${filterType === t.key ? 'active' : ''}" data-type="${t.key}"
      style="background:${filterType === t.key ? t.bg : 'transparent'};color:${filterType === t.key ? t.color : '#666'};border-color:${filterType === t.key ? t.color : '#dde3ea'};">
      ${t.label}
    </button>
  `).join('');
  tabs.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filterType = btn.dataset.type;
      buildTabs(); buildSidebar();
    });
  });
}

// ===================== SELECT ROUTE =====================
function stopIcon(color, isTerminal) {
  const size = isTerminal ? 14 : 9;
  const radius = isTerminal ? 2 : size/2;
  return L.divIcon({
    html: `<div style="width:${size}px;height:${size}px;background:${color};border:2px solid white;border-radius:${radius}px;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>`,
    className: '',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
  });
}

function selectRoute(route) {
  activeRoute = route;

  // clear previous
  if (activeLayer) { map.removeLayer(activeLayer); activeLayer = null; }
  activeMarkers.forEach(m => map.removeLayer(m));
  activeMarkers = [];

  // draw polyline
  const latlngs = route.stops.map(s => [s.lat, s.lng]);
  activeLayer = L.polyline(latlngs, { color: route.color, weight: 4, opacity: 0.85, dashArray: null }).addTo(map);

  // draw markers
  route.stops.forEach((stop, i) => {
    const marker = L.marker([stop.lat, stop.lng], { icon: stopIcon(route.color, stop.terminal) })
      .addTo(map)
      .bindTooltip(`<b>${stop.name}</b>`, { direction: 'top', offset: [0, -6], className: 'leaflet-tooltip' });
    activeMarkers.push(marker);
  });

  map.fitBounds(activeLayer.getBounds(), { padding: [40, 40] });

  showInfoPanel(route);
  buildSidebar();
}

// ===================== INFO PANEL =====================
function showInfoPanel(route) {
  const panel = document.getElementById('infoPanel');
  document.getElementById('ipNum').textContent = route.num;
  document.getElementById('ipNum').style.background = route.color;
  document.getElementById('ipName').textContent = route.name;
  document.getElementById('ipType').textContent = TYPES[route.type].label;

  document.getElementById('ipMeta').innerHTML = `
    <div class="meta-chip">🎫 <b>Tarifa:</b> ${route.tarifa}</div>
    <div class="meta-chip">📏 <b>Distancia:</b> ${route.km}</div>
    <div class="meta-chip">🛑 <b>Paradas:</b> ${route.stops.length}</div>
  `;

  document.getElementById('ipStops').innerHTML = route.stops.map((s, i) => {
    const isLast = i === route.stops.length - 1;
    return `
      <div class="stop-row ${s.terminal ? 'terminal' : ''}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:0;">
          <div class="stop-dot" style="background:${s.terminal ? route.color : '#aaa'};border-radius:${s.terminal ? '2px' : '50%'};"></div>
          ${!isLast ? `<div class="stop-line" style="background:${route.color};opacity:0.25;width:2px;height:16px;"></div>` : ''}
        </div>
        <span style="color:${s.terminal ? '#111' : '#555'};font-weight:${s.terminal ? 700 : 400};">${s.name}</span>
      </div>
    `;
  }).join('');

  panel.classList.add('visible');
}

document.getElementById('closePanel').addEventListener('click', () => {
  document.getElementById('infoPanel').classList.remove('visible');
  if (activeLayer) { map.removeLayer(activeLayer); activeLayer = null; }
  activeMarkers.forEach(m => map.removeLayer(m));
  activeMarkers = [];
  activeRoute = null;
  buildSidebar();
});

// ===================== SEARCH =====================
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value;
  buildSidebar();
});

// ===================== LEGEND COLOR =====================
document.getElementById('ll').style.background = '#2a6496';

// ===================== INIT =====================
buildTabs();
buildSidebar();

// Default: show all routes lightly on map
ROUTES.forEach(r => {
  const latlngs = r.stops.map(s => [s.lat, s.lng]);
  L.polyline(latlngs, { color: r.color, weight: 2, opacity: 0.25 }).addTo(map);
});
</script>
</body>
</html>
